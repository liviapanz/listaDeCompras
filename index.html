<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lista de Compras — localStorage</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Lista de Compras</h1>
      <p class="description">Adicione itens e quantidades para acompanhar suas compras. Marque como comprado, edite ou remova itens conforme necessário.</p>
       <div id="summary-info" class="summary">Nenhum item adicionado ainda.</div>

      <form id="add-form" class="add-form">
        <input id="item-input" type="text" placeholder="Adicione um item (ex: Leite)" autocomplete="off" />
        <input id="quantity-input" type="number" min="1" value="1" placeholder="Qtd" />
        <button type="submit">Adicionar</button>
      </form>

      <section class="controls">
        <div class="theme-selector">
          <label for="theme-select">Tema</label>
          <select id="theme-select">
            <option value="light">Claro</option>
            <option value="dark">Escuro</option>
          </select>
        </div>
        <button id="clear-btn" class="danger">Limpar tudo</button>
      </section>

      <ul id="items" class="items"></ul>
    </main>

    <script src="app.js"></script>
  </body>
</html>
